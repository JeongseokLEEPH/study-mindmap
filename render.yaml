services:
  - type: web
    name: mindmap
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: mindmap-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
